name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, against whatever is newest on PyPI. A dependency's breaking release
  # shows up here within a week, before a user finds it on a fresh install.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both ends of the supported MCP range (pyproject: mcp>=1.3).
          - { python-version: "3.10", mcp: "oldest" }
          - { python-version: "3.10", mcp: "newest" }
          - { python-version: "3.13", mcp: "newest" }
    name: py${{ matrix.python-version }} · mcp ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from scratch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: Pin the oldest supported MCP
        if: matrix.mcp == 'oldest'
        run: pip install "mcp==1.3.0"
      - name: Show what was installed
        run: pip show mcp | head -2
      - name: Tests, including the MCP server over stdio
        run: pytest -q
      - name: The CLI must actually run
        run: doceval --help
