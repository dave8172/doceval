[build-system]
requires = ["hatchling>=1.27"]   # >=1.27 for SPDX license expressions
build-backend = "hatchling.build"

[project]
name = "doceval"
version = "0.4.2"
description = "Eval harness for LLM extraction pipelines — field-level accuracy, failure taxonomy, cost tracking. Documents, emails, HTML, transcripts, feeds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dave8172", email = "mdhawal94@gmail.com" }]
requires-python = ">=3.10"
keywords = ["extraction", "document-extraction", "llm", "evaluation", "evals", "ocr", "accuracy", "mcp", "agent-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
examples = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]
mcp = [
    # Pinned below 2.0: mcp_server.py is v1 code. MCP 2.x renamed FastMCP to
    # MCPServer and changed other APIs, so an unpinned install breaks the extra.
    # Caught by CI on 2026-09-04 — a local venv holding mcp 1.x had hidden it.
    "mcp>=1.0,<2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
doceval = "doceval.cli:main"
doceval-mcp = "doceval.mcp_server:main"

[project.urls]
Homepage = "https://github.com/dave8172/doceval"
Repository = "https://github.com/dave8172/doceval"
Issues = "https://github.com/dave8172/doceval/issues"
Changelog = "https://github.com/dave8172/doceval/releases"

[tool.hatch.build.targets.wheel]
packages = ["doceval"]
